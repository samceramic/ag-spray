<script>
(function(){
  'use strict';
  var SKEY='agSession';
  var el=function(id){return document.getElementById(id)};
  // 先把資料取出來，頁面切換後原本的元素就不在了
  var EMBED=el('agAccounts').textContent, LITE=el('agLite').textContent, PRO=el('agPro').textContent, PRO_IV=el('agPro').dataset.iv;
  function fromB64(s){ var bin=atob(s.trim()), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function toB64(u){ var s=''; for(var i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
  function fail(t){ el('boot').innerHTML='<img src="icon-192.png" alt=""><b>農噴測量</b><div class="err"></div>'; el('boot').querySelector('.err').textContent=t; }
  function loadScript(src){ return new Promise(function(ok,err){ var s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=err; document.head.appendChild(s); }); }
  function gunzip(u8){
    if(window.DecompressionStream){
      var ds=new DecompressionStream('gzip');
      return new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer().then(function(b){ return new TextDecoder().decode(b); });
    }
    return loadScript('https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js').then(function(){ return new TextDecoder().decode(window.fflate.gunzipSync(u8)); });
  }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function getSession(){ try{ return JSON.parse(localStorage.getItem(SKEY)||sessionStorage.getItem(SKEY)||'null'); }catch(e){ return null; } }
  function clearSession(){ try{ localStorage.removeItem(SKEY); sessionStorage.removeItem(SKEY); }catch(e){} }
  function sha256hex(t){ return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){ return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join(''); }); }
  // 帳號清單：網站上的 accounts.json 為準（管理員可隨時更新），離線時用內建版本
  function loadAccounts(){
    var embedded=JSON.parse(EMBED);
    if(!location.protocol.startsWith('http')) return Promise.resolve({acc:embedded,src:'embedded'});
    var ac=window.AbortController?new AbortController():null, t=setTimeout(function(){ ac&&ac.abort(); },4000);
    return fetch('accounts.json?t='+Date.now(),{cache:'no-store',signal:ac&&ac.signal}).then(function(r){
      clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json();
    }).then(function(j){ if(!j||!Array.isArray(j.accounts)) throw new Error('bad'); return {acc:j,src:'online'}; })
      .catch(function(){ clearTimeout(t); return {acc:embedded,src:'offline'}; });
  }
  // 換上新頁面：用 DOMParser 建立，再依序執行外部與內嵌程式（不用 document.write，慢速網路也不會被瀏覽器擋）
  function write(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    [].forEach.call(doc.querySelectorAll('script'),function(s){ s.setAttribute('data-type',s.getAttribute('type')||''); s.setAttribute('type','text/x-ag-hold'); });
    document.replaceChild(document.importNode(doc.documentElement,true),document.documentElement);
    return [].slice.call(document.querySelectorAll('script[type="text/x-ag-hold"]')).reduce(function(p,old){
      return p.then(function(){
        var t=old.getAttribute('data-type'), n=document.createElement('script');
        [].forEach.call(old.attributes,function(a){ if(a.name!=='type'&&a.name!=='data-type') n.setAttribute(a.name,a.value); });
        if(t) n.setAttribute('type',t);
        if(t&&t!=='text/javascript'&&t!=='module'){ n.textContent=old.textContent; old.parentNode.replaceChild(n,old); return; }
        if(old.src) return new Promise(function(ok){ n.onload=ok; n.onerror=ok; old.parentNode.replaceChild(n,old); });
        n.textContent=old.textContent; old.parentNode.replaceChild(n,old);
      });
    },Promise.resolve());
  }
  function decryptPro(kB64){
    return crypto.subtle.importKey('raw',fromB64(kB64),'AES-GCM',false,['decrypt'])
      .then(function(k){ return crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(PRO_IV)},k,fromB64(PRO)); })
      .then(function(buf){ return gunzip(new Uint8Array(buf)); });
  }
  function showLite(){ return gunzip(fromB64(LITE)).then(write); }

  // 登入：用密碼解開該帳號保存的金鑰；解得開才算登入成功
  window.agLogin=function(user,pass,remember){
    if(!window.crypto||!crypto.subtle) return Promise.reject(new Error('此瀏覽器不支援安全登入，請用 https 網址開啟，並使用最新版 Chrome 或 Safari。'));
    var id, entry;
    return Promise.all([loadAccounts(),sha256hex('ag-spray|'+user.trim().toLowerCase())]).then(function(r){
      id=r[1]; entry=r[0].acc.accounts.filter(function(a){return a.id===id})[0];
      if(!entry) throw new Error('帳號或密碼錯誤。');
      if(entry.start&&entry.start>today()) throw new Error('此帳號將於 '+entry.start+' 開始使用，目前尚未啟用。');
      if(entry.exp&&entry.exp<today()) throw new Error('此帳號已於 '+entry.exp+' 到期，請聯絡管理員。');
      return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
    }).then(function(base){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(entry.salt),iterations:entry.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(kek){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(entry.iv)},kek,fromB64(entry.wk)).catch(function(){ throw new Error('帳號或密碼錯誤。'); });
    }).then(function(raw){
      var s=JSON.stringify({id:id,salt:entry.salt,role:entry.role,user:user.trim(),start:entry.start||'',exp:entry.exp||'',k:toB64(new Uint8Array(raw)),at:new Date().toISOString()});
      clearSession(); (remember?localStorage:sessionStorage).setItem(SKEY,s);
      location.reload();
    });
  };

  function boot(){
    var s=getSession();
    if(!s||!s.k) return showLite();
    return loadAccounts().then(function(r){
      var e=r.acc.accounts.filter(function(a){return a.id===s.id})[0], why='';
      if(!e&&r.src==='online') why='此帳號已被管理員停用，請重新登入。';
      else if(e&&e.start&&e.start>today()) why='帳號將於 '+e.start+' 開始使用，目前尚未啟用。';
      else if(e&&e.exp&&e.exp<today()) why='帳號已於 '+e.exp+' 到期，請聯絡管理員。';
      else if(e&&e.salt!==s.salt) why='密碼已變更，請用新密碼重新登入。';
      if(why){ clearSession(); try{sessionStorage.setItem('agMsg',why)}catch(x){} return showLite(); }
      if(e){ s.role=e.role; s.start=e.start||''; s.exp=e.exp||''; }
      try{ sessionStorage.setItem('agAccounts',JSON.stringify(r.acc)); sessionStorage.setItem('agAccSrc',r.src); }catch(x){}
      window.agSession=s;
      return decryptPro(s.k).then(function(html){ return write(html); },function(){
        clearSession(); try{sessionStorage.setItem('agMsg','登入資料已失效，請重新登入。')}catch(x){} return showLite();
      });
    });
  }
  boot().catch(function(e){ fail('無法開啟：'+(e&&e.message||e)+'。請更新瀏覽器後再試。'); });
})();
</script>
